name: Release Desktop Installer

# 데스크탑 설치파일(NSIS .exe)과 자동 업데이트 메타데이터(latest.yml·blockmap)를 빌드해
# GitHub Release 에 게시한다. 설치된 앱은 electron-updater 로 이 릴리스를 받아 자동 업데이트한다.
# 버전 단일 원천: electron/package.json — 태그가 이 버전과 일치해야 한다.
#
# 릴리스 절차:
#   1) electron/package.json 의 version 을 올린다 (예: 1.4.0 → 1.5.0)
#   2) 커밋·푸시 후 동일 버전 태그를 만든다:  git tag v1.5.0 && git push origin v1.5.0
#   3) 본 워크플로가 windows-latest 에서 사이드카(PyInstaller) + Electron(NSIS)을 빌드하고
#      electron-builder --publish always 로 Release(v1.5.0)에 exe·latest.yml·blockmap 을 올린다.
#      (publish 대상·인증은 package.json build.publish + GH_TOKEN)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 버전 단일 원천(electron/package.json) 읽기 → 이후 단계 입력으로 노출
      - name: Read version from electron/package.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw "electron/package.json 에서 version 을 읽지 못했습니다." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          Write-Host "version=$v / tag=v$v"

      # 태그 push 로 실행됐다면 태그와 package.json 버전이 일치하는지 가드(단일 원천 강제)
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "${{ steps.ver.outputs.tag }}"
          if ($tag -ne $expected) {
            throw "태그($tag)가 electron/package.json 버전($expected)과 다릅니다. package.json 버전을 올린 뒤 동일 태그로 릴리스하세요."
          }

      # 1) Python 사이드카(단일 exe) — electron extraResources 로 패키징됨
      - name: Build Python sidecar
        shell: pwsh
        run: |
          cd proxy/python
          pip install -r requirements.txt
          .\build.ps1 -Clean

      # 2) Electron 앱 + NSIS 설치파일 빌드 후 GitHub Release 에 게시
      #    electron-builder 가 publish 설정(github)에 따라 exe·latest.yml·blockmap 업로드(releaseType: release)
      - name: Build & publish Electron app (NSIS)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm install
          npm run release
